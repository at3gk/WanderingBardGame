<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` is what lets the page extend under the notch and
         home indicator, and — the part that matters here — it is the token
         that makes env(safe-area-inset-*) resolve to anything but zero. The
         HUD already probes those insets (src/ui/Hud.ts); without this it has
         been reading zeros on every device. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Wandering Bard</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231a1621'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23c98a5b'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23e8d9c0'/%3E%3C/svg%3E" />
    <!-- The manifest below is save-system armour, not branding. Safari's
         Intelligent Tracking Prevention deletes a site's localStorage after
         seven days without a visit — which is exactly the gap a cozy game
         invites — but WebKit exempts web apps added to the home screen. So
         "installable" is the only way an iPad player's journey survives a
         fortnight away, and a manifest whose icons don't resolve is a
         manifest iOS won't offer to install. The icons are generated by
         tools/make-icons.mjs from the same mark as the SVG favicon above. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#1a1621" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wandering Bard" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #1a1621;
        overscroll-behavior: none;
      }
      #game {
        width: 100vw;
        /* `100vh` on mobile Safari/Chrome is sized against the *largest*
           possible viewport (address bar collapsed), not what's actually
           visible on load (address bar shown) — the classic mobile "100vh"
           gap, same family of "real mobile viewport" bug as the touch-action
           and phantom-scroll fixes above. `100dvh` (dynamic viewport height)
           tracks the currently-visible area as browser chrome shows/hides;
           the plain `100vh` above it is a fallback for browsers that don't
           support `dvh` (unknown-value declarations are simply ignored).
           https://caniuse.com/viewport-unit-variants — supported in every
           evergreen mobile/desktop browser this game targets. */
        height: 100vh;
        height: 100dvh;
        /* Rapid/double taps are the entire input model here (ROADMAP task 3),
           so the usual mobile-browser gestures that key off tap timing —
           double-tap-to-zoom, pinch-zoom, long-press text-selection callout —
           fight the game instead of doing nothing. user-scalable=no in the
           viewport meta tag alone doesn't reliably stop this on modern
           mobile Safari, which loosened that meta flag for accessibility. */
        touch-action: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      /* <canvas> defaults to display: inline, so it sits on a text baseline
         and reserves a few px below itself for descenders — the classic
         "phantom scrollbar" gap. That pushes the page a few px taller than
         the viewport, making it vertically scrollable even though #game is
         sized to exactly fill it. */
      #game canvas {
        display: block;
        /* Belt and braces against the canvas laying out at its drawing-buffer
           size. three writes an inline width/height in CSS pixels on every
           setSize (see App.resize, which relies on that), and an inline style
           beats this rule — so in normal operation these two lines do
           nothing. They exist because when the inline style was *not* being
           written, the canvas silently laid out at devicePixelRatio times the
           viewport and every phone user saw the top-left quarter of the game.
           A bug that severe should need two independent mistakes, not one. */
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
